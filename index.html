<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c63a8"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Cpolygon points=%2216,1 29,8.5 29,23.5 16,31 3,23.5 3,8.5%22 fill=%22%23ffb25c%22/%3E%3C/svg%3E">
</head><body>
<title>Hexalia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800;900&family=Young+Serif&display=swap">
<style>
/* Layout: full-height table. Large island map fills the left; a fixed control panel on the right scrolls on its own. On phones the map sits on top and the panel follows. */
:root {
  --bg: #1c63a8;
  --sea: #2273bd;
  --card: #f7f0e0;
  --card-2: #ece2ca;
  --well: #efe5cf;
  --line: #d8c9a6;
  --ink: #2b2620;
  --ink-2: #4d463a;
  --muted: #7c735f;
  --accent: #f28c28;
  --accent-ink: #2b1504;
  --good: #23874a;
  --bad: #c2352a;
  --font-display: "Young Serif", Georgia, "Times New Roman", serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
html { background: var(--bg); }
body {
  margin: 0;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  background: var(--bg);
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; margin: 0; text-wrap: balance; }

#app { height: 100%; display: flex; flex-direction: column; }
.topbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-block: 10px; flex: none; }
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; }
.brand h1 { font-size: 24px; color: #fff; text-shadow: 0 2px 0 rgba(0, 0, 0, .25); }
.brand-mark { width: 28px; height: 28px; }
.topbar .spacer { flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; background: var(--card); color: var(--ink-2); font-size: 14px; font-weight: 700; }
.chip strong { color: var(--ink); letter-spacing: .14em; }

/* Main split */
.split { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 18px; padding-bottom: 14px; }
.board-wrap { position: relative; min-height: 0; min-width: 0; border-radius: 22px; overflow: hidden; background: var(--sea); box-shadow: inset 0 0 0 3px rgba(255, 255, 255, .18), 0 6px 18px rgba(0, 0, 0, .25); }
.board-wrap svg { width: 100%; height: 100%; display: block; }
.side { min-height: 0; overflow-y: auto; display: grid; gap: 12px; align-content: start; padding-right: 2px; padding-bottom: 8px; }
@media (max-width: 900px) {
  #app { height: auto; }
  .board-wrap { touch-action: pan-y; }
  .split { grid-template-columns: minmax(0, 1fr); }
  .board-wrap { height: min(96vw, 72vh); }
  .side { overflow: visible; }
}

.hint {
  position: absolute; left: 50%; top: 14px; transform: translateX(-50%);
  background: var(--card); border: 2px solid var(--accent); color: var(--ink);
  padding: 8px 16px; border-radius: 999px; font-weight: 700; font-size: 15px; max-width: calc(100% - 24px);
  text-align: center; pointer-events: none; box-shadow: 0 6px 20px rgba(0, 0, 0, .35);
}
.mapbtn { position: absolute; right: 12px; top: 12px; }
.mapbtn .btn { white-space: nowrap; background: var(--card); border-color: var(--accent); }
.legend { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 6px; flex-wrap: wrap; max-width: calc(100% - 24px); }
.legend span { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; background: rgba(247, 240, 224, .92); padding: 3px 8px 3px 4px; border-radius: 999px; color: var(--ink-2); }
.legend i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
@media (max-width: 520px) { .legend { display: none; } .hint { font-size: 13px; top: 8px; } }

/* Cards */
.card { background: var(--card); border: 1px solid var(--line); box-shadow: 0 3px 0 #c9b88f, 0 6px 16px rgba(0, 0, 0, .18); border-radius: 16px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.card h3 { font-size: 20px; }
.card p { margin: 0; color: var(--ink-2); }
.label { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 800; display: flex; justify-content: space-between; gap: 8px; align-items: center; }

/* Buttons */
.btn { border: 1px solid var(--line); background: #fffaf0; box-shadow: 0 2px 0 var(--line); border-radius: 12px; padding: 10px 16px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform .08s ease, background .15s ease, border-color .15s; }
.btn:hover:not(:disabled) { background: #fff; border-color: #b9a77d; }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; box-shadow: 0 3px 0 #b8611a; }
.btn.primary:hover:not(:disabled) { background: #ff9f42; }
.btn.big { width: 100%; padding: 14px 16px; font-size: 18px; border-radius: 14px; }
.btn.ghost { background: transparent; box-shadow: none; }
.btn.small { padding: 6px 11px; font-size: 14px; border-radius: 10px; }
.btn.danger { color: var(--bad); }
.btn.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
input[type=text], select { background: #fffdf7; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-width: 0; }
input[type=text] { width: 100%; }
input[type=text]::placeholder { color: #a49a84; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row > input { flex: 1 1 140px; }
.note { font-size: 14px; color: var(--muted); margin: 0; }
.code { font-family: var(--font-display); letter-spacing: .14em; }

/* Scoreboard */
.score { display: grid; gap: 6px; }
.prow { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 12px; background: var(--well); border: 2px solid transparent; }
.prow.turn { border-color: var(--accent); background: #fff6e6; }
.avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; color: #fff; text-shadow: 0 1px 1px rgba(0, 0, 0, .45); font-size: 15px; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0, 0, 0, .2), inset 0 -3px 0 rgba(0, 0, 0, .2); }
.pname { font-weight: 800; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pmeta { font-size: 13px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
.pvp { text-align: right; font-family: var(--font-display); font-size: 26px; line-height: 1; }
.pvp small { display: block; font-family: var(--font-body); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.tag { font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 800; background: var(--accent); color: var(--accent-ink); }
.tag.soft { background: #e2d4b2; color: var(--ink); }

/* Turn card */
.turncard { border-width: 2px; }
.turncard.mine { border-color: var(--accent); background: linear-gradient(180deg, #fff3de, var(--card)); }
.instr { font-family: var(--font-display); font-size: 24px; line-height: 1.15; }
.instr-sub { color: var(--ink-2); font-size: 15px; margin-top: 4px; }
.whose { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; color: var(--ink-2); }
.whose i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }

.dice { display: flex; gap: 10px; align-items: center; }
.die { width: 42px; height: 42px; border-radius: 10px; background: linear-gradient(145deg, #ffffff, #dce9f5); border: 2px solid #6d8fb3; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); padding: 6px; box-shadow: 0 3px 0 #6d8fb3, 0 6px 12px rgba(0, 0, 0, .25); }
.die i { width: 7px; height: 7px; border-radius: 50%; background: #3f6b98; place-self: center; }
.die.roll { animation: tumble .55s ease; }
@keyframes tumble { 0% { transform: rotate(-120deg) scale(.5); } 70% { transform: rotate(10deg) scale(1.08); } 100% { transform: none; } }
.dice-sum { font-family: var(--font-display); font-size: 30px; }

/* Hand */
.hand { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.rcard { position: relative; border-radius: 12px; padding: 10px 4px 8px; display: grid; justify-items: center; gap: 2px; border: 0; min-width: 0; box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .2), 0 3px 8px rgba(0, 0, 0, .25); }
.rcard .n { font-size: 26px; font-weight: 800; line-height: 1; }
.rcard .l { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; }
.rcard.zero { filter: saturate(.2) brightness(.95); opacity: .55; }
.rcard svg { width: 26px; height: 26px; }
.r-wood { background: linear-gradient(160deg, #3fa463, #24713f); color: #effff4; }
.r-brick { background: linear-gradient(160deg, #e17f50, #b1532b); color: #fff4ee; }
.r-sheep { background: linear-gradient(160deg, #b8e47e, #86b94c); color: #18260a; }
.r-wheat { background: linear-gradient(160deg, #ffd96a, #e0aa31); color: #2c1f02; }
.r-ore { background: linear-gradient(160deg, #a9b0c4, #737b92); color: #f7f8fc; }
.stepper { display: flex; gap: 4px; margin-top: 4px; }
.stepper button { width: 28px; height: 28px; border-radius: 8px; border: 0; background: rgba(0, 0, 0, .28); color: inherit; font-weight: 900; font-size: 16px; padding: 0; }
.stepper button:disabled { opacity: .3; }

/* Build */
.build { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.bbtn { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 4px 10px; align-items: center; text-align: left; padding: 10px; border-radius: 12px; border: 1px solid var(--line); background: #fffaf0; box-shadow: 0 2px 0 var(--line); }
.bbtn:hover:not(:disabled) { border-color: #b9a77d; background: #fff; }
.bbtn:disabled { cursor: not-allowed; }
.bbtn:disabled .bname, .bbtn:disabled .bico { opacity: .45; }
.bbtn.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
.bico { grid-row: span 2; width: 36px; height: 36px; }
.bname { font-weight: 800; font-size: 15px; }
.bname small { font-weight: 600; color: var(--muted); }
.bcost { display: flex; gap: 3px; flex-wrap: wrap; align-items: center; }
.bcost .ci { width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center; }
.bcost .ci svg { width: 13px; height: 13px; }
.why { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }

/* Tabs */
.tabs { display: flex; gap: 4px; background: var(--card-2); padding: 4px; border-radius: 12px; }
.tabs button { flex: 1; border: 0; background: transparent; padding: 8px 6px; border-radius: 9px; font-weight: 800; font-size: 14px; color: var(--ink-2); position: relative; }
.tabs button.on { background: #fffaf0; color: var(--ink); box-shadow: 0 1px 0 var(--line); }
.tabs .dotn { position: absolute; top: 4px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }

.trade-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.trade-grid .rcard { padding: 8px 2px 6px; }
.trade-grid .rcard .n { font-size: 20px; }
.offer { padding: 12px; border-radius: 12px; background: #fffaf0; border: 2px dashed var(--accent); display: grid; gap: 10px; }
.offer .line { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.mini { display: inline-flex; align-items: center; gap: 3px; padding: 2px 7px 2px 3px; border-radius: 8px; font-weight: 800; font-size: 14px; }
.mini svg { width: 16px; height: 16px; }
.list { display: grid; gap: 6px; }
.li { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 12px; background: var(--well); border: 1px solid var(--line); min-width: 0; }
.li .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dev { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 12px; background: var(--well); border: 1px solid var(--line); }
.dev .grow { flex: 1; min-width: 0; }
.dev b { display: block; }
.dev span { font-size: 13px; color: var(--muted); }
.log { max-height: 260px; overflow: auto; display: grid; gap: 5px; font-size: 14px; color: var(--muted); }
.log div:last-child { color: var(--ink); }
.rules { margin: 0; padding-left: 18px; display: grid; gap: 7px; color: var(--ink-2); font-size: 14px; }
.rules b { color: var(--ink); }
.bank { display: flex; gap: 6px; flex-wrap: wrap; }

.hero h2 { font-size: clamp(26px, 3.2vw, 38px); line-height: 1.1; }

.overlay { position: fixed; inset: 0; background: rgba(10, 30, 50, .6); display: grid; place-items: center; z-index: 50; padding: 16px; }
.overlay .card { max-width: 440px; width: 100%; text-align: center; justify-items: center; }
.overlay h2 { font-size: 36px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 12px; font-weight: 700; z-index: 60; max-width: calc(100% - 32px); box-shadow: 0 8px 30px rgba(0, 0, 0, .4); }

/* Board interaction */
.spot { cursor: pointer; }
.spot .ring { fill: rgba(242, 140, 40, .45); stroke: #fff; stroke-width: 3; animation: pulse 1.1s ease-in-out infinite; }
.spot:hover .ring { fill: var(--accent); }
.edge-hit { stroke: transparent; stroke-width: 26; stroke-linecap: round; cursor: pointer; }
.edge-glow { stroke: #fff; stroke-width: 6; stroke-linecap: round; stroke-dasharray: 2 9; opacity: .9; pointer-events: none; animation: pulse 1.1s ease-in-out infinite; }
.edge-hit:hover + .edge-glow { stroke: var(--accent); stroke-dasharray: none; }
.hex-target { fill: rgba(242, 140, 40, .14); stroke: #fff; stroke-width: 3; stroke-dasharray: 8 6; cursor: pointer; }
.hex-target:hover { fill: rgba(242, 140, 40, .4); }
.city-target { fill: rgba(242, 140, 40, .3); stroke: #fff; stroke-width: 3; cursor: pointer; pointer-events: all; animation: pulse 1.1s ease-in-out infinite; }
.hot-hex { fill: none; stroke: #fff6c8; stroke-width: 5; pointer-events: none; animation: glow 1.6s ease-in-out 2; }
@keyframes pulse { 50% { opacity: .45; } }
@keyframes glow { 50% { stroke-width: 9; } }
@media (prefers-reduced-motion: reduce) {
  .spot .ring, .edge-glow, .city-target, .hot-hex, .die.roll { animation: none; }
}

/* Map controls, full-screen map and minimized map */
.mapctl { position: absolute; right: 12px; bottom: 12px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; max-width: calc(100% - 24px); }
.mapctl .btn { white-space: nowrap; background: var(--card); padding: 8px 12px; font-size: 14px; }
.mapctl .btn.primary { background: var(--accent); }
.btn.icon { padding: 8px; width: 40px; height: 40px; }
.board-wrap.pz { touch-action: none; cursor: grab; }
.board-wrap.pz:active { cursor: grabbing; }
.fullbar { display: none; }
.board-wrap.full {
  position: fixed; inset: 0; z-index: 45; border-radius: 0; height: auto;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}
.board-wrap.full svg { height: 100%; }
.board-wrap.full .legend { display: none; }
.board-wrap.full .hint, .board-wrap.full .mapbtn { display: none; }
.board-wrap.full .mapctl { bottom: auto; top: calc(12px + env(safe-area-inset-top, 0px)); right: calc(12px + env(safe-area-inset-right, 0px)); }
.board-wrap.full .fullbar:not(:empty) {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  position: absolute; left: 0; right: 0; bottom: 0;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: var(--card); border-top: 2px solid var(--line); color: var(--ink);
}
.fb-text { font-weight: 800; flex: 1 1 160px; min-width: 0; }
.fb-res { display: flex; gap: 4px; flex-wrap: wrap; }
body.map-open { overflow: hidden; }
.board-wrap.min { height: 150px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.board-wrap.min .legend, .board-wrap.min .hint, .board-wrap.min .mapbtn { display: none; }
.board-wrap.min svg { width: 60%; }
.board-wrap.min .mapctl { top: 8px; bottom: 8px !important; right: 8px; width: calc(40% - 16px); flex-direction: column; flex-wrap: nowrap; justify-content: center; align-items: stretch; }
.board-wrap.min .mapctl .btn { padding: 6px 10px; font-size: 13px; }
@media (max-width: 900px) {
  .board-wrap:not(.full):not(.min) { cursor: zoom-in; }
  .board-wrap:not(.full) .mapctl { right: 8px; bottom: 8px; }
  .board-wrap:not(.full) .mapctl .btn { padding: 6px 10px; font-size: 13px; }
  .mapbtn .btn { padding: 8px 12px; font-size: 14px; }
}

/* Dice shown on the map, as on a real table */
.mapdice { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 8px; align-items: center; pointer-events: none; }
.mapdice .die { width: 52px; height: 52px; padding: 8px; }
.mapdice .die i { width: 9px; height: 9px; }
.board-wrap.min .mapdice, .board-wrap.full .mapdice { display: none; }
@media (max-width: 520px) { .mapdice .die { width: 38px; height: 38px; padding: 5px; } .mapdice .die i { width: 6px; height: 6px; } }
.side .bankrow { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; align-items: end; }
.bankrow .rcard { padding: 6px 2px 5px; }
.bankrow .rcard .n { font-size: 17px; }
.bankrow .rcard svg { width: 18px; height: 18px; }
.bankrow .devc { background: linear-gradient(160deg, #8a6bd1, #5d43a6); color: #fff; }
.legend[hidden] { display: none; }
@media (max-width: 900px) { .mapdice { display: none; } }
.topbar .btn.ghost { color: #fff; border-color: rgba(255, 255, 255, .55); }
.topbar .btn.ghost:hover:not(:disabled) { background: rgba(255, 255, 255, .15); border-color: #fff; }

/* Resource legend lives in the top bar, out of the map's way */
.topbar-l { display: contents; }
.topbar .brand { order: 0; }
.topbar .legend { order: 1; position: static; max-width: none; flex-wrap: nowrap; gap: 5px; margin-left: 8px; }
.topbar .spacer { order: 2; }
.topbar .chip, .topbar .btn { order: 3; }
.topbar .legend span { font-size: 12px; padding: 2px 8px 2px 4px; background: rgba(255, 255, 255, .92); }
@media (max-width: 1180px) { .topbar .legend { display: none; } }

/* Laptops with short screens (e.g. 1366x768 or 1360x720): tighter type and spacing so map and panel both fit */
@media (max-height: 820px) and (min-width: 901px), (max-width: 1440px) and (min-width: 901px) {
  body { font-size: 14px; }
  .topbar { padding-block: 6px; gap: 8px; }
  .brand h1 { font-size: 20px; }
  .brand-mark { width: 24px; height: 24px; }
  .split { grid-template-columns: minmax(0, 1fr) 340px; gap: 12px; padding-bottom: 10px; }
  .side { gap: 8px; }
  .card { padding: 11px 12px; gap: 8px; border-radius: 13px; }
  .card h3 { font-size: 17px; }
  .label { font-size: 11px; }
  .instr { font-size: 19px; }
  .instr-sub { font-size: 13px; margin-top: 2px; }
  .whose { font-size: 13px; }
  .btn { padding: 7px 12px; border-radius: 10px; }
  .btn.big { padding: 9px 12px; font-size: 16px; border-radius: 12px; }
  .btn.small { padding: 5px 9px; font-size: 13px; }
  input[type=text], select { padding: 7px 10px; border-radius: 10px; }
  .prow { grid-template-columns: 28px minmax(0, 1fr) auto; gap: 8px; padding: 5px 8px; border-radius: 10px; }
  .avatar { width: 28px !important; height: 28px !important; font-size: 13px; }
  .pname { font-size: 14px; }
  .pmeta { font-size: 12px; gap: 8px; }
  .pvp { font-size: 21px; }
  .pvp small { font-size: 10px; }
  .die { width: 34px; height: 34px; padding: 5px; border-radius: 8px; }
  .die i { width: 6px; height: 6px; }
  .dice-sum { font-size: 24px; }
  .hand { gap: 6px; }
  .rcard { padding: 6px 2px 5px; border-radius: 10px; }
  .rcard .n { font-size: 19px; }
  .rcard .l { font-size: 9.5px; }
  .rcard svg { width: 20px; height: 20px; }
  .build { gap: 6px; }
  .bbtn { grid-template-columns: 28px minmax(0, 1fr); gap: 2px 8px; padding: 7px 8px; border-radius: 10px; }
  .bico { width: 28px; height: 28px; }
  .bname { font-size: 13px; }

<div id="app"></div>
<script>
// Hexalia game engine: pure rules, no DOM. Same code runs in every player's browser.
const Engine = (() => {
  const RES = ['wood', 'brick', 'sheep', 'wheat', 'ore'];
  const RES_NAME = { wood: 'Madera', brick: 'Arcilla', sheep: 'Lana', wheat: 'Trigo', ore: 'Mineral' };
  const TERRAIN_RES = { forest: 'wood', hills: 'brick', pasture: 'sheep', fields: 'wheat', mountains: 'ore', desert: null };
  const TERRAIN_NAME = { forest: 'Bosque', hills: 'Colinas', pasture: 'Pastos', fields: 'Campos', mountains: 'Montañas', desert: 'Desierto' };
  const COST = {
    road: { wood: 1, brick: 1 },
    settlement: { wood: 1, brick: 1, sheep: 1, wheat: 1 },
    city: { wheat: 2, ore: 3 },
    dev: { sheep: 1, wheat: 1, ore: 1 },
  };
  const DEV_NAME = { knight: 'Guardián', road: 'Constructores', plenty: 'Cosecha', monopoly: 'Monopolio', vp: 'Monumento' };
  const DEV_HELP = {
    knight: 'Mueve al bandido y roba una carta. Cuenta para la Guardia mayor.',
    road: 'Construye 2 caminos gratis.',
    plenty: 'Toma 2 recursos cualquiera del banco.',
    monopoly: 'Elige un recurso: todos te dan todas sus cartas de ese recurso.',
    vp: '1 punto de victoria. Se mantiene oculta.',
  };
  const PLAYER_COLORS = [
    { name: 'Coral', hex: '#ef6a5b' },
    { name: 'Laguna', hex: '#38b6d8' },
    { name: 'Ámbar', hex: '#f4c045' },
    { name: 'Orquídea', hex: '#b083e6' },
  ];
  const PIECES = { road: 15, settlement: 5, city: 4 };
  const WIN_VP = 10;
  const IDLE_MS = 5 * 60 * 1000; // after this long without playing, the others may declare a player out
  const TERRAIN_POOL = { forest: 4, pasture: 4, fields: 4, hills: 3, mountains: 3, desert: 1 };
  const TOKENS = [2, 3, 3, 4, 4, 5, 5, 6, 6, 8, 8, 9, 9, 10, 10, 11, 11, 12];
  const PORT_TYPES = ['any', 'any', 'any', 'any', 'wood', 'brick', 'sheep', 'wheat', 'ore'];

  class RuleError extends Error {}
  const fail = (msg) => { throw new RuleError(msg); };

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // ---------- Geometry (fixed 19-hex island, pointy-top, unit size) ----------
  const G = (() => {
    const hexes = [];
    for (let r = -2; r <= 2; r++) for (let q = -2; q <= 2; q++) if (Math.abs(q + r) <= 2) hexes.push({ q, r });
    const SQ = Math.sqrt(3);
    const vMap = new Map(), eMap = new Map(), vertices = [], edges = [];
    hexes.forEach((h, hi) => {
      h.x = SQ * (h.q + h.r / 2);
      h.y = 1.5 * h.r;
      h.corners = [];
      h.edges = [];
      for (let i = 0; i < 6; i++) {
        const a = ((60 * i - 30) * Math.PI) / 180;
        const x = h.x + Math.cos(a), y = h.y + Math.sin(a);
        const key = `${Math.round(x * 1000)},${Math.round(y * 1000)}`;
        let vi = vMap.get(key);
        if (vi === undefined) {
          vi = vertices.length;
          vertices.push({ x, y, hexes: [], adj: [], edges: [] });
          vMap.set(key, vi);
        }
        vertices[vi].hexes.push(hi);
        h.corners.push(vi);
      }
      for (let i = 0; i < 6; i++) {
        const a = Math.min(h.corners[i], h.corners[(i + 1) % 6]);
        const b = Math.max(h.corners[i], h.corners[(i + 1) % 6]);
        const key = `${a}-${b}`;
        let ei = eMap.get(key);
        if (ei === undefined) {
          ei = edges.length;
          edges.push({ a, b, hexes: [] });
          eMap.set(key, ei);
          vertices[a].adj.push(b);
          vertices[b].adj.push(a);
          vertices[a].edges.push(ei);
          vertices[b].edges.push(ei);
        }
        edges[ei].hexes.push(hi);
        h.edges.push(ei);
      }
    });
    hexes.forEach((h) => {
      h.nb = [];
      hexes.forEach((o, oi) => {
        const dq = h.q - o.q, dr = h.r - o.r;
        if ((Math.abs(dq) + Math.abs(dr) + Math.abs(dq + dr)) / 2 === 1) h.nb.push(oi);
      });
    });
    const mid = (e) => [(vertices[e.a].x + vertices[e.b].x) / 2, (vertices[e.a].y + vertices[e.b].y) / 2];
    const coast = edges.map((_, i) => i).filter((i) => edges[i].hexes.length === 1);
    coast.sort((i, j) => {
      const [xi, yi] = mid(edges[i]), [xj, yj] = mid(edges[j]);
      return Math.atan2(yi, xi) - Math.atan2(yj, xj);
    });
    // 9 harbors spread round the 30 coastal edges (gaps 3,3,4).
    const portEdges = [1, 4, 7, 11, 14, 17, 21, 24, 27].map((i) => coast[i]);
    return { hexes, vertices, edges, portEdges, coast };
  })();

  // ---------- Board generation ----------
  // Largest group of touching tiles that share a terrain.
  function biggestCluster(terrains) {
    const seen = new Set();
    let best = 0;
    terrains.forEach((t, i) => {
      if (seen.has(i)) return;
      let n = 0;
      const stack = [i];
      seen.add(i);
      while (stack.length) {
        const h = stack.pop();
        n++;
        G.hexes[h].nb.forEach((j) => { if (!seen.has(j) && terrains[j] === t) { seen.add(j); stack.push(j); } });
      }
      best = Math.max(best, n);
    });
    return best;
  }

  function generateBoard() {
    const pool = Object.entries(TERRAIN_POOL).flatMap(([t, n]) => Array(n).fill(t));
    // At most 2 tiles of the same terrain touch, so no resource ends up in a block of 3 or more.
    let terrains;
    for (let tries = 0; tries < 20000; tries++) {
      terrains = shuffle(pool.slice());
      if (biggestCluster(terrains) <= 2) break;
    }
    let nums;
    for (let tries = 0; tries < 5000; tries++) {
      const t = shuffle(TOKENS.slice());
      nums = terrains.map((ter) => (ter === 'desert' ? 0 : t.pop()));
      const hot = (n) => n === 6 || n === 8;
      const bad = G.hexes.some((h, i) => h.nb.some((j) => (hot(nums[i]) && hot(nums[j])) || (nums[i] && nums[i] === nums[j])));
      if (!bad) break;
    }
    const types = shuffle(PORT_TYPES.slice());
    return {
      hexes: terrains.map((terrain, i) => ({ terrain, num: nums[i] })),
      ports: G.portEdges.map((edge, i) => ({ edge, type: types[i] })),
      robber: terrains.indexOf('desert'),
    };
  }

  // A board sent by a client must be a legal shuffle of the standard pieces.
  function validBoard(b) {
    try {
      if (!b || !Array.isArray(b.hexes) || b.hexes.length !== 19 || !Array.isArray(b.ports) || b.ports.length !== 9) return false;
      const count = {};
      b.hexes.forEach((h) => { count[h.terrain] = (count[h.terrain] || 0) + 1; });
      if (Object.keys(TERRAIN_POOL).some((t) => count[t] !== TERRAIN_POOL[t]) || Object.keys(count).length !== 6) return false;
      if (b.hexes.some((h) => (h.terrain === 'desert') !== (h.num === 0))) return false;
      const nums = b.hexes.map((h) => h.num).filter((n) => n).sort((x, y) => x - y);
      if (nums.join() !== TOKENS.join()) return false;
      if (b.ports.some((p, i) => p.edge !== G.portEdges[i])) return false;
      if (b.ports.map((p) => p.type).sort().join() !== PORT_TYPES.slice().sort().join()) return false;
      return b.robber === b.hexes.findIndex((h) => h.terrain === 'desert');
    } catch { return false; }
  }

  function makeDeck() {
    return shuffle([
      ...Array(14).fill('knight'), ...Array(5).fill('vp'),
      ...Array(2).fill('road'), ...Array(2).fill('plenty'), ...Array(2).fill('monopoly'),
    ]);
  }

  const emptyRes = () => ({ wood: 0, brick: 0, sheep: 0, wheat: 0, ore: 0 });

  function makePlayer(id, name, color) {
    return { id, name, color, res: emptyRes(), dev: [], knights: 0, left: { ...PIECES } };
  }

  function newGame(hostId, hostName) {
    const board = generateBoard();
    return {
      v: 1,
      phase: 'lobby',
      hostId,
      players: [makePlayer(hostId, hostName, 0)],
      board,
      buildings: {},
      roads: {},
      bank: { wood: 19, brick: 19, sheep: 19, wheat: 19, ore: 19 },
      deck: makeDeck(),
      turn: null,
      setup: null,
      discards: null,
      trade: null,
      bids: {},
      longest: { holder: -1, len: 0 },
      army: { holder: -1, size: 0 },
      log: [],
      winner: -1,
      turnNo: 0,
      lastRoll: null,
    };
  }

  // ---------- Queries ----------
  const total = (res) => RES.reduce((n, r) => n + (res[r] || 0), 0);
  const hasRes = (p, cost) => RES.every((r) => (p.res[r] || 0) >= (cost[r] || 0));
  const pay = (s, p, cost) => RES.forEach((r) => { p.res[r] -= cost[r] || 0; s.bank[r] += cost[r] || 0; });
  const fmtRes = (res) => RES.filter((r) => res[r]).map((r) => `${res[r]} ${RES_NAME[r]}`).join(', ') || 'nada';

  function log(s, msg) {
    s.log.push(msg);
    if (s.log.length > 80) s.log.splice(0, s.log.length - 80);
  }

  function settlementSpots(s, p, setup) {
    const out = [];
    G.vertices.forEach((v, vi) => {
      if (s.buildings[vi]) return;
      if (v.adj.some((a) => s.buildings[a])) return;
      if (!setup && !v.edges.some((e) => s.roads[e] === p)) return;
      out.push(vi);
    });
    return out;
  }

  function roadSpots(s, p) {
    const out = [];
    if (s.phase === 'setup') {
      const v = s.setup.lastV;
      return G.vertices[v].edges.filter((e) => s.roads[e] === undefined);
    }
    G.edges.forEach((e, ei) => {
      if (s.roads[ei] !== undefined) return;
      const ok = [e.a, e.b].some((v) => {
        const b = s.buildings[v];
        if (b && b.o === p) return true;
        if (b && b.o !== p) return false;
        return G.vertices[v].edges.some((x) => x !== ei && s.roads[x] === p);
      });
      if (ok) out.push(ei);
    });
    return out;
  }

  function citySpots(s, p) {
    return Object.keys(s.buildings).map(Number).filter((v) => s.buildings[v].o === p && s.buildings[v].t === 's');
  }

  function ratios(s, p) {
    const out = { wood: 4, brick: 4, sheep: 4, wheat: 4, ore: 4 };
    s.board.ports.forEach((port) => {
      const e = G.edges[port.edge];
      const own = [e.a, e.b].some((v) => s.buildings[v] && s.buildings[v].o === p);
      if (!own) return;
      if (port.type === 'any') RES.forEach((r) => { out[r] = Math.min(out[r], 3); });
      else out[port.type] = 2;
    });
    return out;
  }

  function stealTargets(s, p) {
    const set = new Set();
    G.hexes[s.board.robber].corners.forEach((v) => {
      const b = s.buildings[v];
      if (b && b.o !== p && !s.players[b.o].out && total(s.players[b.o].res) > 0) set.add(b.o);
    });
    return [...set];
  }

  function roadLength(s, p) {
    let best = 0;
    const used = new Set();
    const blocked = (v) => s.buildings[v] && s.buildings[v].o !== p;
    function dfs(v, len) {
      if (len > best) best = len;
      if (len > 0 && blocked(v)) return;
      for (const e of G.vertices[v].edges) {
        if (s.roads[e] !== p || used.has(e)) continue;
        used.add(e);
        const ed = G.edges[e];
        dfs(ed.a === v ? ed.b : ed.a, len + 1);
        used.delete(e);
      }
    }
    const starts = new Set();
    Object.keys(s.roads).forEach((e) => {
      if (s.roads[e] === p) { starts.add(G.edges[e].a); starts.add(G.edges[e].b); }
    });
    starts.forEach((v) => dfs(v, 0));
    return best;
  }

  function victoryPoints(s, p, includeHidden) {
    let vp = 0;
    Object.values(s.buildings).forEach((b) => { if (b.o === p) vp += b.t === 'c' ? 2 : 1; });
    if (s.longest.holder === p) vp += 2;
    if (s.army.holder === p) vp += 2;
    if (includeHidden) vp += s.players[p].dev.filter((d) => d.t === 'vp').length;
    return vp;
  }

  function updateLongest(s) {
    const lens = s.players.map((_, i) => roadLength(s, i));
    const max = Math.max(...lens);
    const cur = s.longest.holder;
    if (cur >= 0 && lens[cur] === max && max >= 5) { s.longest.len = max; return; }
    const top = lens.map((l, i) => (l === max ? i : -1)).filter((i) => i >= 0);
    const holder = max >= 5 && top.length === 1 ? top[0] : -1;
    if (holder !== cur) {
      if (holder >= 0) log(s, `${s.players[holder].name} consigue el Camino más largo (${max}).`);
      else log(s, `Nadie tiene el Camino más largo ahora.`);
    }
    s.longest = { holder, len: holder >= 0 ? max : 0 };
  }

  function updateArmy(s, p) {
    const k = s.players[p].knights;
    const need = s.army.holder >= 0 ? s.players[s.army.holder].knights : 2;
    if (s.army.holder !== p && k > need) {
      s.army = { holder: p, size: k };
      log(s, `${s.players[p].name} consigue la Guardia mayor (${k} guardianes).`);
    } else if (s.army.holder === p) s.army.size = k;
  }

  function checkWin(s) {
    if (s.phase !== 'main') return;
    const p = s.turn.cur;
    const vp = victoryPoints(s, p, true);
    if (vp >= WIN_VP) {
      s.phase = 'ended';
      s.winner = p;
      log(s, `🏆 ${s.players[p].name} gana con ${vp} puntos.`);
    }
  }

  function produce(s, roll) {
    const demand = {};
    RES.forEach((r) => { demand[r] = s.players.map(() => 0); });
    s.board.hexes.forEach((h, hi) => {
      if (h.num !== roll || hi === s.board.robber) return;
      const r = TERRAIN_RES[h.terrain];
      G.hexes[hi].corners.forEach((v) => {
        const b = s.buildings[v];
        if (b && !s.players[b.o].out) demand[r][b.o] += b.t === 'c' ? 2 : 1;
      });
    });
    const got = s.players.map(() => emptyRes());
    RES.forEach((r) => {
      const d = demand[r];
      const need = d.reduce((a, b) => a + b, 0);
      if (!need) return;
      const takers = d.filter((x) => x > 0).length;
      if (s.bank[r] >= need) d.forEach((n, i) => { got[i][r] += n; });
      else if (takers === 1) {
        const i = d.findIndex((x) => x > 0);
        got[i][r] += s.bank[r];
        log(s, `El banco se quedó sin ${RES_NAME[r]}.`);
      } else { log(s, `No hay suficiente ${RES_NAME[r]} en el banco: nadie lo recibe.`); return; }
    });
    got.forEach((g, i) => {
      if (!total(g)) return;
      RES.forEach((r) => { s.players[i].res[r] += g[r]; s.bank[r] -= g[r]; });
      log(s, `${s.players[i].name} recibe ${fmtRes(g)}.`);
    });
  }

  function finishRobber(s) {
    s.turn.step = s.turn.rolled ? 'main' : 'roll';
  }

  function doSteal(s, p, target) {
    const t = s.players[target];
    const pool = [];
    RES.forEach((r) => { for (let i = 0; i < t.res[r]; i++) pool.push(r); });
    if (pool.length) {
      const r = pool[Math.floor(Math.random() * pool.length)];
      t.res[r]--;
      s.players[p].res[r]++;
      s.turn.stolen = { from: target, to: p, r };
      log(s, `${s.players[p].name} roba una carta a ${t.name}.`);
    }
    finishRobber(s);
  }

  function endRoadBuilding(s, p) {
    s.turn.freeRoads = 0;
    s.turn.step = s.turn.rolled ? 'main' : 'roll';
  }

  // ---------- Actions ----------
  const H = {};

  H.join = (s, a, p, id) => {
    if (s.phase !== 'lobby') fail('La partida ya empezó.');
    const name = String(a.name || '').trim().slice(0, 18) || 'Jugador';
    if (p >= 0) { s.players[p].name = name; if (Number.isFinite(Number(a.rating))) s.players[p].rating = Math.round(Number(a.rating)); return; }
    if (s.players.length >= 4) fail('La partida está llena (máximo 4).');
    const used = new Set(s.players.map((x) => x.color));
    const color = [0, 1, 2, 3].find((c) => !used.has(c));
    const pl = makePlayer(id, name, color);
    if (Number.isFinite(Number(a.rating))) pl.rating = Math.round(Number(a.rating));
    s.players.push(pl);
    log(s, `${name} se unió.`);
  };

  H.leave = (s, a, p) => {
    if (s.phase !== 'lobby' || p < 0) fail('No puedes salir ahora.');
    const [gone] = s.players.splice(p, 1);
    log(s, `${gone.name} salió.`);
    if (gone.id === s.hostId && s.players.length) s.hostId = s.players[0].id;
  };

  H.color = (s, a, p) => {
    if (s.phase !== 'lobby' || p < 0) fail('No puedes cambiar de color ahora.');
    const c = Number(a.color);
    if (!(c >= 0 && c < 4)) fail('Color no válido.');
    if (s.players.some((x, i) => i !== p && x.color === c)) fail('Ese color ya está ocupado.');
    s.players[p].color = c;
  };

  H.reroll = (s, a, p, id) => {
    if (s.phase !== 'lobby' || id !== s.hostId) fail('Solo el anfitrión puede cambiar el tablero.');
    s.board = generateBoard();
  };

  H.start = (s, a, p, id) => {
    if (s.phase !== 'lobby' || id !== s.hostId) fail('Solo el anfitrión puede empezar.');
    if (s.players.length < 2) fail('Se necesitan al menos 2 jugadores.');
    s.phase = 'order';
    s.order = { contenders: s.players.map((_, i) => i), rolls: {}, dice: {}, round: 1 };
    s.turn = null;
    log(s, 'Cada jugador tira los dados: el número más alto empieza.');
  };

  // Opening roll: highest starts, ties re-roll among the tied players. Seating order is the lobby order.
  H.orderRoll = (s, a, p) => {
    if (s.phase !== 'order') fail('Ya se decidió quién empieza.');
    const o = s.order;
    if (p < 0 || !o.contenders.includes(p)) fail('No te toca tirar ahora.');
    if (o.rolls[p] !== undefined) fail('Ya tiraste.');
    const d = [1 + Math.floor(Math.random() * 6), 1 + Math.floor(Math.random() * 6)];
    o.rolls[p] = d[0] + d[1];
    o.dice[s.players[p].id] = d;
    log(s, `${s.players[p].name} saca ${d[0] + d[1]} para decidir quién empieza.`);
    resolveOrder(s);
  };

  function resolveOrder(s) {
    const o = s.order;
    if (o.contenders.some((i) => o.rolls[i] === undefined)) return;
    const max = Math.max(...o.contenders.map((i) => o.rolls[i]));
    const top = o.contenders.filter((i) => o.rolls[i] === max);
    if (top.length > 1) {
      log(s, `Empate a ${max} entre ${top.map((i) => s.players[i].name).join(' y ')}: vuelven a tirar.`);
      o.contenders = top;
      top.forEach((i) => { delete o.rolls[i]; });
      o.round++;
      return;
    }
    const first = top[0];
    s.players = [...s.players.slice(first), ...s.players.slice(0, first)];
    const n = s.players.length;
    const seats = [...Array(n).keys()].filter((i) => !s.players[i].out);
    const order = [...seats, ...seats.slice().reverse()];
    s.phase = 'setup';
    s.setup = { order, i: 0, lastV: null, round2: seats.length };
    s.turn = { cur: order[0], step: 'settle', rolled: false, devPlayed: false, freeRoads: 0 };
    const lead = s.players[order[0]];
    log(s, `${lead.name} empieza con ${max}. Orden: ${seats.map((i) => s.players[i].name).join(' → ')}.`);
    log(s, `${lead.name}: coloca tu primer poblado y camino.`);
  }

  // Move setup on to the next placement, or start the game once everyone placed twice.
  function nextSetup(s) {
    if (s.setup.i >= s.setup.order.length) {
      s.phase = 'main';
      s.turnNo = 1;
      const seat = s.setup.order.find((i) => !s.players[i].out);
      const first = seat !== undefined ? seat : nextAlive(s, -1);
      s.turn = { cur: first, step: 'roll', rolled: false, devPlayed: false, freeRoads: 0 };
      log(s, `Fin de la colocación. Turno de ${s.players[first].name}.`);
    } else {
      s.turn.cur = s.setup.order[s.setup.i];
      s.turn.step = 'settle';
      s.setup.lastV = null;
    }
  }

  function nextAlive(s, p) {
    const n = s.players.length;
    for (let k = 1; k <= n; k++) {
      const i = (p + k + n) % n;
      if (!s.players[i].out) return i;
    }
    return p;
  }

  function mustBeCur(s, p) {
    if (p < 0 || s.turn.cur !== p) fail('No es tu turno.');
  }

  H.settle = (s, a, p) => {
    const v = Number(a.v);
    if (s.phase === 'setup') {
      mustBeCur(s, p);
      if (s.turn.step !== 'settle') fail('Ahora toca colocar un camino.');
      if (!settlementSpots(s, p, true).includes(v)) fail('No puedes poblar ahí (deja al menos un cruce libre entre poblados).');
      s.buildings[v] = { o: p, t: 's' };
      s.players[p].left.settlement--;
      s.setup.lastV = v;
      if (s.setup.i >= (s.setup.round2 || s.players.length)) {
        const g = emptyRes();
        G.vertices[v].hexes.forEach((hi) => {
          const r = TERRAIN_RES[s.board.hexes[hi].terrain];
          if (r && s.bank[r] > 0) { g[r]++; s.bank[r]--; s.players[p].res[r]++; }
        });
        log(s, `${s.players[p].name} funda su segundo poblado y recibe ${fmtRes(g)}.`);
      } else log(s, `${s.players[p].name} funda su primer poblado.`);
      s.turn.step = 'road';
      return;
    }
    if (s.phase !== 'main') fail('La partida no está en curso.');
    mustBeCur(s, p);
    if (s.turn.step !== 'main') fail('Primero tira los dados.');
    const pl = s.players[p];
    if (!pl.left.settlement) fail('No te quedan poblados (mejora uno a ciudad).');
    if (!hasRes(pl, COST.settlement)) fail('Te faltan recursos: Madera, Arcilla, Lana y Trigo.');
    if (!settlementSpots(s, p, false).includes(v)) fail('Ese cruce no es válido: debe tocar tu camino y estar a 2 tramos de otros poblados.');
    pay(s, pl, COST.settlement);
    s.buildings[v] = { o: p, t: 's' };
    pl.left.settlement--;
    log(s, `${pl.name} construye un poblado.`);
    updateLongest(s);
    checkWin(s);
  };

  H.road = (s, a, p) => {
    const e = Number(a.e);
    if (s.phase === 'setup') {
      mustBeCur(s, p);
      if (s.turn.step !== 'road') fail('Primero coloca un poblado.');
      if (!roadSpots(s, p).includes(e)) fail('El camino debe salir del poblado que acabas de colocar.');
      s.roads[e] = p;
      s.players[p].left.road--;
      s.setup.i++;
      nextSetup(s);
      return;
    }
    if (s.phase !== 'main') fail('La partida no está en curso.');
    mustBeCur(s, p);
    const pl = s.players[p];
    const free = s.turn.step === 'roadBuilding';
    if (!free && s.turn.step !== 'main') fail('Primero tira los dados.');
    if (!pl.left.road) fail('No te quedan caminos.');
    if (!free && !hasRes(pl, COST.road)) fail('Te falta Madera o Arcilla.');
    if (!roadSpots(s, p).includes(e)) fail('El camino debe conectar con tus caminos o poblados.');
    if (!free) pay(s, pl, COST.road);
    s.roads[e] = p;
    pl.left.road--;
    log(s, `${pl.name} construye un camino${free ? ' gratis' : ''}.`);
    updateLongest(s);
    if (free) {
      s.turn.freeRoads--;
      if (s.turn.freeRoads <= 0 || !pl.left.road || !roadSpots(s, p).length) endRoadBuilding(s, p);
    }
    checkWin(s);
  };

  H.city = (s, a, p) => {
    if (s.phase !== 'main') fail('La partida no está en curso.');
    mustBeCur(s, p);
    if (s.turn.step !== 'main') fail('Primero tira los dados.');
    const v = Number(a.v);
    const pl = s.players[p];
    if (!pl.left.city) fail('No te quedan ciudades.');
    if (!hasRes(pl, COST.city)) fail('Una ciudad cuesta 2 Trigo y 3 Mineral.');
    if (!citySpots(s, p).includes(v)) fail('Solo puedes mejorar tus propios poblados.');
    pay(s, pl, COST.city);
    s.buildings[v] = { o: p, t: 'c' };
    pl.left.city--;
    pl.left.settlement++;
    log(s, `${pl.name} convierte un poblado en ciudad.`);
    checkWin(s);
  };

  H.roll = (s, a, p) => {
    if (s.phase !== 'main') fail('La partida no está en curso.');
    mustBeCur(s, p);
    if (s.turn.step !== 'roll') fail('Ya tiraste los dados.');
    const d = [1 + Math.floor(Math.random() * 6), 1 + Math.floor(Math.random() * 6)];
    const sum = d[0] + d[1];
    s.turn.rolled = true;
    s.turn.stolen = null;
    s.lastRoll = { d, by: p, turnNo: s.turnNo };
    log(s, `${s.players[p].name} saca ${sum} (${d[0]}+${d[1]}).`);
    if (sum === 7) {
      const disc = {};
      s.players.forEach((pl, i) => {
        const n = total(pl.res);
        if (n > 7 && !pl.out) disc[i] = Math.floor(n / 2);
      });
      if (Object.keys(disc).length) {
        s.discards = disc;
        s.turn.step = 'discard';
        log(s, `¡7! Quien tenga más de 7 cartas descarta la mitad.`);
      } else {
        s.turn.step = 'robber';
        log(s, `¡7! ${s.players[p].name} mueve al bandido.`);
      }
      return;
    }
    produce(s, sum);
    s.turn.step = 'main';
  };

  H.discard = (s, a, p) => {
    if (s.phase !== 'main' || s.turn.step !== 'discard') fail('No hay descartes pendientes.');
    if (p < 0 || s.discards[p] === undefined) fail('No tienes que descartar.');
    const res = a.res || {};
    const pl = s.players[p];
    if (RES.some((r) => (res[r] || 0) < 0 || (res[r] || 0) > pl.res[r])) fail('No tienes esas cartas.');
    if (total(res) !== s.discards[p]) fail(`Debes descartar exactamente ${s.discards[p]} cartas.`);
    pay(s, pl, res);
    log(s, `${pl.name} descarta ${s.discards[p]} cartas.`);
    delete s.discards[p];
    if (!Object.keys(s.discards).length) {
      s.discards = null;
      s.turn.step = 'robber';
    }
  };

  H.robber = (s, a, p) => {
    if (s.phase !== 'main' || s.turn.step !== 'robber') fail('Ahora no se mueve el bandido.');
    mustBeCur(s, p);
    const h = Number(a.h);
    if (!(h >= 0 && h < 19)) fail('Casilla no válida.');
    if (h === s.board.robber) fail('El bandido debe moverse a otra casilla.');
    s.board.robber = h;
    log(s, `${s.players[p].name} mueve al bandido a ${TERRAIN_NAME[s.board.hexes[h].terrain]}${s.board.hexes[h].num ? ' ' + s.board.hexes[h].num : ''}.`);
    const t = stealTargets(s, p);
    if (!t.length) finishRobber(s);
    else if (t.length === 1) doSteal(s, p, t[0]);
    else s.turn.step = 'steal';
  };

  H.steal = (s, a, p) => {
    if (s.phase !== 'main' || s.turn.step !== 'steal') fail('Ahora no puedes robar.');
    mustBeCur(s, p);
    const t = Number(a.target);
    if (!stealTargets(s, p).includes(t)) fail('No puedes robar a ese jugador.');
    doSteal(s, p, t);
  };

  H.buyDev = (s, a, p) => {
    if (s.phase !== 'main') fail('La partida no está en curso.');
    mustBeCur(s, p);
    if (s.turn.step !== 'main') fail('Primero tira los dados.');
    const pl = s.players[p];
    if (!s.deck.length) fail('No quedan cartas de desarrollo.');
    if (!hasRes(pl, COST.dev)) fail('Una carta cuesta Lana, Trigo y Mineral.');
    pay(s, pl, COST.dev);
    pl.dev.push({ t: s.deck.pop(), turn: s.turnNo });
    log(s, `${pl.name} compra una carta de desarrollo.`);
    checkWin(s);
  };

  H.playDev = (s, a, p) => {
    if (s.phase !== 'main') fail('La partida no está en curso.');
    mustBeCur(s, p);
    if (!['roll', 'main'].includes(s.turn.step)) fail('Termina la acción actual primero.');
    if (s.turn.devPlayed) fail('Solo puedes jugar una carta de desarrollo por turno.');
    const pl = s.players[p];
    const t = a.card;
    if (t === 'vp') fail('Los Monumentos no se juegan: ya cuentan como punto.');
    const idx = pl.dev.findIndex((d) => d.t === t && d.turn < s.turnNo);
    if (idx < 0) fail(pl.dev.some((d) => d.t === t) ? 'No puedes jugar una carta el mismo turno que la compras.' : 'No tienes esa carta.');
    if (t === 'plenty') {
      const pick = a.res || [];
      if (pick.length !== 2 || pick.some((r) => !RES.includes(r))) fail('Elige 2 recursos.');
      const need = emptyRes();
      pick.forEach((r) => need[r]++);
      if (RES.some((r) => s.bank[r] < need[r])) fail('El banco no tiene esos recursos.');
      RES.forEach((r) => { s.bank[r] -= need[r]; pl.res[r] += need[r]; });
      log(s, `${pl.name} juega Cosecha y toma ${fmtRes(need)}.`);
    } else if (t === 'monopoly') {
      const r = a.res;
      if (!RES.includes(r)) fail('Elige un recurso.');
      let n = 0;
      s.players.forEach((o, i) => { if (i !== p) { n += o.res[r]; o.res[r] = 0; } });
      pl.res[r] += n;
      log(s, `${pl.name} juega Monopolio de ${RES_NAME[r]} y se lleva ${n}.`);
    } else if (t === 'road') {
      if (!pl.left.road || !roadSpots(s, p).length) fail('No tienes dónde construir caminos.');
      s.turn.freeRoads = Math.min(2, pl.left.road);
      s.turn.step = 'roadBuilding';
      log(s, `${pl.name} juega Constructores: 2 caminos gratis.`);
    } else if (t === 'knight') {
      pl.knights++;
      s.turn.step = 'robber';
      log(s, `${pl.name} juega un Guardián.`);
      updateArmy(s, p);
    } else fail('Carta desconocida.');
    pl.dev.splice(idx, 1);
    s.turn.devPlayed = true;
    checkWin(s);
  };

  H.bankTrade = (s, a, p) => {
    if (s.phase !== 'main') fail('La partida no está en curso.');
    mustBeCur(s, p);
    if (s.turn.step !== 'main') fail('Primero tira los dados.');
    const give = a.give, get = a.get;
    if (!RES.includes(give) || !RES.includes(get) || give === get) fail('Elige qué das y qué recibes.');
    const n = ratios(s, p)[give];
    const pl = s.players[p];
    if (pl.res[give] < n) fail(`Necesitas ${n} de ${RES_NAME[give]}.`);
    if (s.bank[get] < 1) fail(`El banco no tiene ${RES_NAME[get]}.`);
    pl.res[give] -= n; s.bank[give] += n;
    pl.res[get]++; s.bank[get]--;
    log(s, `${pl.name} cambia ${n} ${RES_NAME[give]} por 1 ${RES_NAME[get]} con el banco.`);
  };

  H.offer = (s, a, p) => {
    if (s.phase !== 'main') fail('La partida no está en curso.');
    mustBeCur(s, p);
    if (s.turn.step !== 'main') fail('Primero tira los dados.');
    const { give, get } = readOffer(a);
    if (!hasRes(s.players[p], give)) fail('No tienes lo que ofreces.');
    s.trade = { give, get, resp: {} };
    log(s, `${s.players[p].name} ofrece ${fmtRes(give)} a cambio de ${fmtRes(get)}.`);
  };

  H.respond = (s, a, p) => {
    if (!s.trade) fail('No hay oferta abierta.');
    if (p < 0 || p === s.turn.cur) fail('No puedes responder a tu propia oferta.');
    if (s.players[p].out) fail('Ya no estás en la partida.');
    const yes = !!a.accept;
    if (yes && !hasRes(s.players[p], s.trade.get)) fail('No tienes lo que piden.');
    s.trade.resp[p] = yes;
  };

  H.acceptOffer = (s, a, p) => {
    mustBeCur(s, p);
    const t = s.trade;
    if (!t) fail('No hay oferta abierta.');
    const o = Number(a.target);
    if (t.resp[o] !== true) fail('Ese jugador no aceptó.');
    const me = s.players[p], other = s.players[o];
    if (!hasRes(me, t.give)) fail('Ya no tienes lo que ofreciste.');
    if (!hasRes(other, t.get)) fail(`${other.name} ya no tiene lo que pediste.`);
    RES.forEach((r) => {
      me.res[r] += t.get[r] - t.give[r];
      other.res[r] += t.give[r] - t.get[r];
    });
    log(s, `${me.name} y ${other.name} intercambian (${fmtRes(t.give)} ⇄ ${fmtRes(t.get)}).`);
    s.trade = null;
  };

  H.cancelOffer = (s, a, p) => {
    mustBeCur(s, p);
    s.trade = null;
  };

  // Proposals from the other players to the player whose turn it is. Each player keeps at most one open.
  function readOffer(a) {
    const give = emptyRes(), get = emptyRes();
    RES.forEach((r) => { give[r] = Math.max(0, Math.floor(+a.give?.[r] || 0)); get[r] = Math.max(0, Math.floor(+a.get?.[r] || 0)); });
    if (!total(give) || !total(get)) fail('La oferta debe dar y pedir algo.');
    if (RES.some((r) => give[r] && get[r])) fail('No puedes dar y pedir el mismo recurso.');
    return { give, get };
  }

  H.bid = (s, a, p) => {
    if (s.phase !== 'main') fail('La partida no está en curso.');
    if (p < 0) fail('No estás en esta mesa.');
    if (p === s.turn.cur) fail('En tu turno haces ofertas a todos desde Comercio.');
    if (s.players[p].out) fail('Ya no estás en la partida.');
    if (s.turn.step !== 'main') fail(`Espera a que ${s.players[s.turn.cur].name} tire los dados.`);
    const { give, get } = readOffer(a);
    if (!hasRes(s.players[p], give)) fail('No tienes lo que ofreces.');
    s.bids = s.bids || {};
    s.bids[p] = { give, get };
    log(s, `${s.players[p].name} propone a ${s.players[s.turn.cur].name}: da ${fmtRes(give)} y pide ${fmtRes(get)}.`);
  };

  H.withdrawBid = (s, a, p) => {
    if (s.bids) delete s.bids[p];
  };

  H.rejectBid = (s, a, p) => {
    mustBeCur(s, p);
    const o = Number(a.target);
    if (!s.bids || !s.bids[o]) fail('Esa propuesta ya no está.');
    delete s.bids[o];
    log(s, `${s.players[p].name} rechaza la propuesta de ${s.players[o].name}.`);
  };

  H.acceptBid = (s, a, p) => {
    mustBeCur(s, p);
    if (s.turn.step !== 'main') fail('Termina la acción actual primero.');
    const o = Number(a.target);
    const b = s.bids && s.bids[o];
    if (!b) fail('Esa propuesta ya no está.');
    const me = s.players[p], other = s.players[o];
    if (!hasRes(other, b.give)) { delete s.bids[o]; fail(`${other.name} ya no tiene lo que ofrecía.`); }
    if (!hasRes(me, b.get)) fail('No tienes lo que te piden.');
    RES.forEach((r) => {
      me.res[r] += b.give[r] - b.get[r];
      other.res[r] += b.get[r] - b.give[r];
    });
    log(s, `${me.name} acepta la propuesta de ${other.name} (${fmtRes(b.give)} ⇄ ${fmtRes(b.get)}).`);
    delete s.bids[o];
  };

  H.endTurn = (s, a, p) => {
    if (s.phase !== 'main') fail('La partida no está en curso.');
    mustBeCur(s, p);
    if (s.turn.step !== 'main') fail(s.turn.step === 'roll' ? 'Primero tira los dados.' : 'Termina la acción actual primero.');
    passTurn(s, p);
  };

  function passTurn(s, p) {
    s.trade = null;
    s.bids = {};
    s.discards = null;
    s.turnNo++;
    s.turn = { cur: nextAlive(s, p), step: 'roll', rolled: false, devPlayed: false, freeRoads: 0 };
    log(s, `Turno de ${s.players[s.turn.cur].name}.`);
  }

  // ---------- Leaving a game ----------
  // Who the table is waiting on right now (the ones who can be declared out after IDLE_MS).
  function waitingOn(s) {
    if (s.phase === 'order') return s.order.contenders.filter((i) => s.order.rolls[i] === undefined);
    if (s.phase === 'setup') return [s.turn.cur];
    if (s.phase === 'main') return s.turn.step === 'discard' && s.discards ? Object.keys(s.discards).map(Number) : [s.turn.cur];
    return [];
  }

  function idleFor(s, p, now) {
    const since = Math.max(s.stepAt || 0, (s.seen && s.seen[s.players[p].id]) || 0);
    return since ? now - since : 0;
  }

  function knockOut(s, p, why) {
    const pl = s.players[p];
    pl.out = true;
    pl.outOrder = s.players.filter((x) => x.out).length;
    log(s, `${pl.name} ${why}.`);
    if (s.bids) delete s.bids[p];
    if (s.trade) delete s.trade.resp[p];
    const alive = s.players.map((x, i) => i).filter((i) => !s.players[i].out);
    if (alive.length === 1) {
      s.phase = 'ended';
      s.winner = alive[0];
      log(s, `🏆 ${s.players[alive[0]].name} gana: es quien queda en la mesa.`);
      return;
    }
    if (s.phase === 'order') {
      const o = s.order;
      o.contenders = o.contenders.filter((i) => i !== p);
      delete o.rolls[p];
      if (o.contenders.length === 1) { o.rolls = { [o.contenders[0]]: o.rolls[o.contenders[0]] || 0 }; }
      if (!o.contenders.length) o.contenders = alive;
      resolveOrder(s);
      return;
    }
    if (s.phase === 'setup') {
      const st = s.setup;
      const wasCur = s.turn.cur === p;
      const placed = wasCur && s.turn.step === 'road'; // settlement down, road missing: that placement just ends
      const keep = [];
      let r2 = st.round2 || s.players.length;
      st.order.forEach((x, k) => {
        if (k >= st.i && x === p && !(placed && k === st.i)) { if (k < (st.round2 || s.players.length)) r2--; return; }
        keep.push(x);
      });
      st.order = keep;
      st.round2 = r2;
      if (placed) st.i++;
      if (wasCur) nextSetup(s);
      return;
    }
    if (s.phase === 'main') {
      if (s.turn.cur === p) { passTurn(s, p); return; }
      if (s.discards && s.discards[p] !== undefined) {
        delete s.discards[p];
        if (!Object.keys(s.discards).length) { s.discards = null; s.turn.step = 'robber'; }
      }
      if (s.turn.step === 'steal' && !stealTargets(s, s.turn.cur).length) finishRobber(s);
    }
  }

  H.resign = (s, a, p) => {
    if (!['order', 'setup', 'main'].includes(s.phase)) fail('La partida no está en curso.');
    if (p < 0 || s.players[p].out) fail('Ya no estás en la partida.');
    knockOut(s, p, 'abandona la partida');
  };

  H.claimIdle = (s, a, p, id, now) => {
    if (!['order', 'setup', 'main'].includes(s.phase)) fail('La partida no está en curso.');
    if (p < 0 || s.players[p].out) fail('No estás jugando esta partida.');
    const t = Number(a.target);
    if (!waitingOn(s).includes(t) || t === p) fail('Ese jugador no está bloqueando la partida.');
    if (idleFor(s, t, now) < IDLE_MS) fail('Todavía no pasaron 5 minutos sin que juegue.');
    knockOut(s, t, 'queda fuera por inactividad');
  };

  // `now` (ms) comes from the server clock; it times inactivity.
  function apply(state, action, actorId, now = Date.now()) {
    const s = JSON.parse(JSON.stringify(state));
    const h = action && Object.prototype.hasOwnProperty.call(H, action.type) ? H[action.type] : null;
    if (!h) return { ok: false, error: 'Acción desconocida.' };
    const p = s.players.findIndex((x) => x.id === actorId);
    const before = JSON.stringify([s.phase, waitingOn(s), s.turn && s.turn.step]);
    try {
      h(s, action, p, actorId, now);
    } catch (e) {
      if (e instanceof RuleError) return { ok: false, error: e.message };
      throw e;
    }
    s.seen = s.seen || {};
    if (p >= 0) s.seen[actorId] = now;
    if (JSON.stringify([s.phase, waitingOn(s), s.turn && s.turn.step]) !== before || !s.stepAt) s.stepAt = now;
    return { ok: true, state: s };
  }

  return {
    RES, RES_NAME, TERRAIN_RES, TERRAIN_NAME, COST, DEV_NAME, DEV_HELP, PLAYER_COLORS, PIECES, WIN_VP, IDLE_MS, G,
    newGame, generateBoard, validBoard, biggestCluster, apply, total, hasRes, ratios, settlementSpots, roadSpots, citySpots, stealTargets,
    roadLength, victoryPoints, fmtRes, waitingOn, idleFor,
  };
})();
if (typeof module !== 'undefined') module.exports = Engine;
</script>
<script>
// Hexalia board renderer: a static island layer (terrain, coast, harbors) and a live layer (pieces, robber, targets).
const Board = (() => {
  const E = Engine, G = E.G;
  const S = 56;
  const P = (n) => (n * S).toFixed(1);

  function shade(hex, f) {
    const n = parseInt(hex.slice(1), 16);
    let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
    if (f < 0) { r *= 1 + f; g *= 1 + f; b *= 1 + f; } else { r += (255 - r) * f; g += (255 - g) * f; b += (255 - b) * f; }
    return `rgb(${r | 0},${g | 0},${b | 0})`;
  }

  function hexPts(hi, scale = 1) {
    const h = G.hexes[hi];
    return h.corners.map((v) => {
      const x = h.x + (G.vertices[v].x - h.x) * scale, y = h.y + (G.vertices[v].y - h.y) * scale;
      return `${P(x)},${P(y)}`;
    }).join(' ');
  }

  // Flat cartoon tiles: [face, rim, highlight].
  const TERR = {
    forest: ['#3aa543', '#1f7a2c', '#63c46b'],
    pasture: ['#a6d846', '#76a826', '#c6ec74'],
    fields: ['#f6c935', '#d09612', '#ffe27a'],
    hills: ['#ec7b3d', '#b44d1d', '#f9a06a'],
    mountains: ['#b3b7be', '#7a7f88', '#d6d9dd'],
    desert: ['#e6d9a4', '#b8a867', '#f3ebc6'],
  };

  const RES_ICON = {
    wood: '<path d="M12 2 4.5 13h4L5 18.5h14L15.5 13h4z" fill="currentColor"/><rect x="10.8" y="18" width="2.4" height="4" fill="currentColor"/>',
    brick: '<rect x="2" y="5" width="9" height="6" rx="1" fill="currentColor"/><rect x="13" y="5" width="9" height="6" rx="1" fill="currentColor"/><rect x="7" y="13" width="10" height="6" rx="1" fill="currentColor"/><rect x="2" y="13" width="3.5" height="6" rx="1" fill="currentColor"/><rect x="18.5" y="13" width="3.5" height="6" rx="1" fill="currentColor"/>',
    sheep: '<ellipse cx="11" cy="13" rx="7.5" ry="5.5" fill="currentColor"/><circle cx="19" cy="10" r="3.2" fill="currentColor"/><rect x="7" y="17" width="2.2" height="5" fill="currentColor"/><rect x="13" y="17" width="2.2" height="5" fill="currentColor"/>',
    wheat: '<path d="M12 23V6" stroke="currentColor" stroke-width="2"/><ellipse cx="8.6" cy="9" rx="2.2" ry="3.8" fill="currentColor"/><ellipse cx="15.4" cy="9" rx="2.2" ry="3.8" fill="currentColor"/><ellipse cx="8.6" cy="15.5" rx="2.2" ry="3.8" fill="currentColor"/><ellipse cx="15.4" cy="15.5" rx="2.2" ry="3.8" fill="currentColor"/><ellipse cx="12" cy="3.6" rx="2" ry="3.2" fill="currentColor"/>',
    ore: '<path d="M1.5 21 8.5 7l4.2 6.5L16 9l6.5 12z" fill="currentColor"/><path d="M8.5 7l2 3.2-2 1.2-2-1.1z" fill="#fff" opacity=".7"/>',
    any: '<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M9.2 9.3a2.9 2.9 0 1 1 4 2.7c-.8.4-1.2 1-1.2 1.9v.6" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round"/><circle cx="12" cy="17.6" r="1.4" fill="currentColor"/>',
  };
  const resIcon = (r, size = 22, extra = '') => `<svg viewBox="0 0 24 24" width="${size}" height="${size}" aria-hidden="true" ${extra}>${RES_ICON[r]}</svg>`;
  const RES_COLOR = { wood: '#2f8a4e', brick: '#cf6a3d', sheep: '#86b94c', wheat: '#e0aa31', ore: '#737b92', any: '#3c4a52' };

  function defs() {
    return `<defs>
      <pattern id="p-waves" width="120" height="80" patternUnits="userSpaceOnUse"><path d="M10 24q10 -8 20 0t20 0M66 62q10 -8 20 0t20 0" stroke="#5aa6e0" stroke-width="2" fill="none" stroke-linecap="round" opacity=".55"/></pattern>
      <filter id="f-shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="2.5" stdDeviation="1.6" flood-color="#0b2a44" flood-opacity=".45"/></filter>
      <filter id="f-soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0b2a44" flood-opacity=".35"/></filter>
    </defs>`;
  }

  // ----- terrain art: one big centered icon per tile, like a board-game illustration -----
  const OUT = 'stroke="#2b2b2b" stroke-opacity=".28" stroke-width="1.2" stroke-linejoin="round"';
  const tuft = (x, y, c) => `<path d="M${x - 4} ${y}l1.6-5M${x} ${y}v-6M${x + 4} ${y}l-1.6-5" stroke="${c}" stroke-width="1.6" stroke-linecap="round" fill="none"/>`;
  const pine = (x, y, s = 1) => `<g ${OUT}><rect x="${x - 2.2 * s}" y="${y + 9 * s}" width="${4.4 * s}" height="${6 * s}" fill="#7a4a22"/>
    <path d="M${x} ${y - 22 * s}L${x - 15 * s} ${y + 10 * s}H${x + 15 * s}Z" fill="#1d7a33"/><path d="M${x} ${y - 22 * s}L${x + 15 * s} ${y + 10 * s}H${x}Z" fill="#16652a"/>
    <path d="M${x} ${y - 26 * s}L${x - 10 * s} ${y - 4 * s}H${x + 10 * s}Z" fill="#279a42"/><path d="M${x} ${y - 26 * s}L${x + 10 * s} ${y - 4 * s}H${x}Z" fill="#1e8137"/></g>`;
  const sheepIcon = (x, y) => `<g ${OUT}><rect x="${x - 8}" y="${y + 4}" width="3" height="8" rx="1" fill="#3a3a3a"/><rect x="${x + 4}" y="${y + 4}" width="3" height="8" rx="1" fill="#3a3a3a"/>
    <path d="M${x - 14} ${y + 2}c-4 -4 -1 -10 4 -9c1 -5 8 -6 11 -2c4 -3 10 -1 10 4c5 1 5 8 1 10c0 4 -6 6 -9 3c-3 3 -10 3 -12 0c-4 1 -8 -2 -5 -6z" fill="#ffffff"/>
    <ellipse cx="${x + 15}" cy="${y - 4}" rx="5.5" ry="4.5" fill="#3a3a3a"/><ellipse cx="${x + 12}" cy="${y - 8}" rx="2.4" ry="1.3" fill="#3a3a3a"/><circle cx="${x + 16.5}" cy="${y - 5}" r="1" fill="#fff"/></g>`;
  const wheatIcon = (x, y) => {
    let g = `<path d="M${x} ${y + 16}V${y - 14}" stroke="#a87412" stroke-width="2.4" stroke-linecap="round"/><path d="M${x} ${y + 12}q-9 -8 -12 -20M${x} ${y + 12}q9 -8 12 -20" stroke="#a87412" stroke-width="2" fill="none" stroke-linecap="round"/>`;
    const grain = (gx, gy, rot) => `<ellipse cx="${gx}" cy="${gy}" rx="2.6" ry="4.6" transform="rotate(${rot} ${gx} ${gy})" fill="#fbe08a" stroke="#b07b10" stroke-width="1"/>`;
    for (let i = 0; i < 4; i++) { g += grain(x - 3.2, y - 10 + i * 6, -25) + grain(x + 3.2, y - 10 + i * 6, 25); }
    g += grain(x, y - 16, 0) + grain(x - 12, y - 10, -30) + grain(x + 12, y - 10, 30);
    return `<g>${g}</g>`;
  };
  const brickIcon = (x, y) => {
    const br = (bx, by, w) => `<rect x="${bx}" y="${by}" width="${w}" height="7" rx="1.5" fill="#fbd6bf" stroke="#b24f22" stroke-width="1.2"/>`;
    return `<g>${br(x - 19, y - 2, 12)}${br(x - 6, y - 2, 12)}${br(x + 7, y - 2, 12)}${br(x - 13, y - 10, 12)}${br(x, y - 10, 12)}${br(x - 6, y - 18, 12)}</g>`;
  };
  const rockIcon = (x, y) => `<g ${OUT}><path d="M${x - 20} ${y + 6}q-2 -10 8 -12q6 -6 13 0q4 8 -2 12z" fill="#f2f3f5"/><path d="M${x - 4} ${y + 6}q-1 -13 10 -14q9 1 9 9q1 5 -4 5z" fill="#e2e4e8"/><path d="M${x - 9} ${y - 7}q2 -9 10 -8q7 2 5 8z" fill="#fafafa"/>
    <path d="M${x - 14} ${y + 1}h6M${x + 4} ${y - 1}h7" stroke="#b6b9c0" stroke-width="1.4" stroke-linecap="round"/></g>`;
  const cactus = (x, y) => `<g ${OUT}><path d="M${x - 3.5} ${y + 18}V${y - 14}a3.5 3.5 0 0 1 7 0V${y + 18}z" fill="#5f9b4a"/><path d="M${x - 3.5} ${y + 2}h-6a3 3 0 0 1 -3 -3v-7a3 3 0 0 1 6 0v4h3z" fill="#5f9b4a"/><path d="M${x + 3.5} ${y - 2}h6a3 3 0 0 0 3 -3v-6a3 3 0 0 0 -6 0v3h-3z" fill="#5f9b4a"/></g>
    <ellipse cx="${x}" cy="${y + 19}" rx="12" ry="2.5" fill="#b8a867" opacity=".6"/>`;
  const pebbles = (x, y) => `<ellipse cx="${x}" cy="${y}" rx="4" ry="2.4" fill="#000" opacity=".12"/><ellipse cx="${x + 6}" cy="${y + 2}" rx="2.4" ry="1.6" fill="#000" opacity=".12"/>`;

  function art(terrain, cx, cy) {
    const ix = cx, iy = cy - 24;
    switch (terrain) {
      case 'forest': return tuft(cx - 30, cy + 8, '#1f7a2c') + tuft(cx + 30, cy + 8, '#1f7a2c') + pine(ix, iy + 2, 0.95);
      case 'pasture': return tuft(cx - 30, cy + 6, '#76a826') + tuft(cx + 30, cy + 6, '#76a826') + tuft(cx - 22, cy - 26, '#76a826') + sheepIcon(ix - 2, iy + 2);
      case 'fields': return tuft(cx - 30, cy + 6, '#d09612') + tuft(cx + 30, cy + 6, '#d09612') + wheatIcon(ix, iy + 2);
      case 'hills': return pebbles(cx - 30, cy + 8) + pebbles(cx + 26, cy + 6) + brickIcon(ix, iy + 6);
      case 'mountains': return pebbles(cx - 30, cy + 8) + pebbles(cx + 26, cy + 6) + rockIcon(ix, iy + 4);
      case 'desert': return pebbles(cx - 26, cy + 14) + pebbles(cx + 20, cy - 16) + cactus(cx, cy - 4);
    }
    return '';
  }

  // A small sailing ship that carries the harbor's trade rate on its sail.
  function ship(X, Y, type) {
    const col = RES_COLOR[type];
    return `<g filter="url(#f-shadow)">
      <path d="M${X - 22} ${Y + 10}q22 8 44 0" stroke="#e9f6ff" stroke-width="2.2" fill="none" stroke-linecap="round" opacity=".8"/>
      <path d="M${X - 20} ${Y + 1}h40l-7 10h-26z" fill="#c07a3a" stroke="#6b3f17" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M${X - 17} ${Y + 5}h34" stroke="#f2c27a" stroke-width="1.6"/>
      <path d="M${X} ${Y + 1}V${Y - 34}" stroke="#6b3f17" stroke-width="2.2"/>
      <path d="M${X} ${Y - 34}l9 3l-9 3z" fill="${col}"/>
      <path d="M${X - 15} ${Y - 28}q15 -4 30 0v24q-15 4 -30 0z" fill="#fffdf6" stroke="#b9ae93" stroke-width="1.4" stroke-linejoin="round"/>
    </g>
    <svg x="${X - 8}" y="${Y - 28}" width="16" height="16" viewBox="0 0 24 24" style="color:${col}" aria-hidden="true">${RES_ICON[type]}</svg>
    <text x="${X}" y="${Y - 6}" text-anchor="middle" font-family="Figtree, sans-serif" font-weight="900" font-size="10.5" fill="#3a2a1a">${type === 'any' ? '3:1' : '2:1'}</text>`;
  }

  function staticLayer(s) {
    const b = s.board;
    const out = [];
    out.push(`<rect x="-2000" y="-2000" width="4000" height="4000" fill="url(#p-waves)"/>`);
    // shallow water, foam line and beach
    out.push(`<g>${b.hexes.map((_, hi) => `<polygon points="${hexPts(hi, 1.24)}" fill="#3f93d6" stroke="#3f93d6" stroke-width="6" stroke-linejoin="round"/>`).join('')}</g>`);
    out.push(`<g>${b.hexes.map((_, hi) => `<polygon points="${hexPts(hi, 1.16)}" fill="#dff3fb" stroke="#dff3fb" stroke-width="5" stroke-linejoin="round"/>`).join('')}</g>`);
    out.push(`<g filter="url(#f-soft)">${b.hexes.map((_, hi) => `<polygon points="${hexPts(hi, 1.11)}" fill="#f1d898" stroke="#f1d898" stroke-width="4" stroke-linejoin="round"/>`).join('')}</g>`);
    // harbors: wooden piers from both corners, ship out in the water
    b.ports.forEach((port) => {
      const e = G.edges[port.edge];
      const va = G.vertices[e.a], vb = G.vertices[e.b];
      const h = G.hexes[e.hexes[0]];
      const mx = (va.x + vb.x) / 2, my = (va.y + vb.y) / 2;
      const dx = mx - h.x, dy = my - h.y, len = Math.hypot(dx, dy);
      const ux = dx / len, uy = dy / len;
      [va, vb].forEach((v) => {
        const x2 = v.x + ux * 0.42, y2 = v.y + uy * 0.42;
        out.push(`<line x1="${P(v.x)}" y1="${P(v.y)}" x2="${P(x2)}" y2="${P(y2)}" stroke="#7b4a20" stroke-width="10" stroke-linecap="butt"/>`);
        out.push(`<line x1="${P(v.x)}" y1="${P(v.y)}" x2="${P(x2)}" y2="${P(y2)}" stroke="#d99a52" stroke-width="7" stroke-dasharray="3 2.2"/>`);
      });
      const X = (mx + ux * 0.8) * S, Y = (my + uy * 0.8) * S + 10;
      const name = port.type === 'any' ? 'Puerto 3:1: cambia 3 iguales por 1' : `Puerto 2:1 de ${E.RES_NAME[port.type]}`;
      out.push(`<g><title>${name}</title>${ship(X, Y, port.type)}</g>`);
    });
    // terrain tiles: dark rim, flat face, light inner bevel
    b.hexes.forEach((hx, hi) => {
      const [face, rim, hl] = TERR[hx.terrain];
      const h = G.hexes[hi];
      const cx = h.x * S, cy = h.y * S;
      out.push(`<g><title>${E.TERRAIN_NAME[hx.terrain]}${hx.num ? ' · ' + hx.num : ''}${E.TERRAIN_RES[hx.terrain] ? ' · produce ' + E.RES_NAME[E.TERRAIN_RES[hx.terrain]] : ''}</title>`);
      out.push(`<polygon points="${hexPts(hi, 0.985)}" fill="${rim}" stroke="${shade(rim, -0.25)}" stroke-width="1.5" stroke-linejoin="round"/>`);
      out.push(`<polygon points="${hexPts(hi, 0.9)}" fill="${face}" stroke="${hl}" stroke-width="3" stroke-linejoin="round"/>`);
      out.push(art(hx.terrain, cx, cy));
      if (hx.num) {
        const hot = hx.num === 6 || hx.num === 8;
        const pips = 6 - Math.abs(7 - hx.num);
        const ink = hot ? '#d0142c' : '#1f4a2a';
        const ty = cy + 14;
        out.push(`<g filter="url(#f-shadow)"><rect x="${cx - 17}" y="${ty - 16}" width="34" height="32" rx="6" fill="#f9f7f0" stroke="#d4ccb6" stroke-width="1.2"/></g>`);
        out.push(`<text x="${cx}" y="${ty + 5}" text-anchor="middle" font-family="Figtree, sans-serif" font-weight="900" font-size="${hot ? 21 : 19}" fill="${ink}" stroke="${ink}" stroke-width=".6">${hx.num}</text>`);
        for (let i = 0; i < pips; i++) out.push(`<circle cx="${(cx + (i - (pips - 1) / 2) * 4.4).toFixed(1)}" cy="${ty + 11}" r="1.6" fill="${ink}"/>`);
      }
      out.push('</g>');
    });
    return out.join('');
  }

  function settlementShape(x, y, c) {
    return `<g filter="url(#f-shadow)"><path d="M${x - 9} ${y + 8}H${x + 3}V${y - 1}L${x - 3} ${y - 8}L${x - 9} ${y - 1}Z" fill="${c}" stroke="#0b1418" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M${x + 3} ${y + 8}L${x + 10} ${y + 4}V${y - 5}L${x + 3} ${y - 1}Z" fill="${shade(c, -0.32)}" stroke="#0b1418" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M${x - 3} ${y - 8}L${x + 4} ${y - 12}L${x + 10} ${y - 5}L${x + 3} ${y - 1}Z" fill="${shade(c, -0.18)}" stroke="#0b1418" stroke-width="1.6" stroke-linejoin="round"/>
      <rect x="${x - 5}" y="${y + 2}" width="3" height="6" fill="${shade(c, -0.55)}"/></g>`;
  }
  function cityShape(x, y, c) {
    return `<g filter="url(#f-shadow)"><path d="M${x - 14} ${y + 9}H${x + 4}V${y - 2}H${x - 3}V${y - 8}L${x - 8.5} ${y - 14}L${x - 14} ${y - 8}Z" fill="${c}" stroke="#0b1418" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M${x + 4} ${y + 9}L${x + 13} ${y + 4}V${y - 6}L${x + 4} ${y - 2}Z" fill="${shade(c, -0.32)}" stroke="#0b1418" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M${x - 3} ${y - 2}L${x + 6} ${y - 7}L${x + 13} ${y - 6}L${x + 4} ${y - 2}Z" fill="${shade(c, -0.15)}" stroke="#0b1418" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M${x - 8.5} ${y - 14}L${x - 3} ${y - 8}V${y - 2}" fill="none" stroke="#0b1418" stroke-width="1"/>
      <rect x="${x - 11}" y="${y + 1}" width="3" height="4" fill="${shade(c, -0.55)}"/><rect x="${x - 4}" y="${y + 1}" width="3" height="4" fill="${shade(c, -0.55)}"/><rect x="${x - 10}" y="${y - 7}" width="3" height="3" fill="${shade(c, -0.55)}"/></g>`;
  }

  function liveLayer(s, t, colorOf) {
    const out = [];
    const b = s.board;
    const roll = s.lastRoll && s.phase === 'main' ? s.lastRoll.d[0] + s.lastRoll.d[1] : 0;
    b.hexes.forEach((hx, hi) => { if (roll && hx.num === roll && hi !== b.robber) out.push(`<polygon class="hot-hex" points="${hexPts(hi, 0.96)}"/>`); });
    // robber
    {
      const h = G.hexes[b.robber];
      const cx = h.x * S, cy = h.y * S;
      out.push(`<polygon points="${hexPts(b.robber, 0.9)}" fill="rgba(20,30,40,.28)" pointer-events="none"/>`);
      const rx = cx + 24, ry = cy - 4;
      out.push(`<g pointer-events="none" filter="url(#f-shadow)"><ellipse cx="${rx}" cy="${ry + 19}" rx="11" ry="3.5" fill="rgba(0,0,0,.3)"/><path d="M${rx - 11} ${ry + 18}q0 -6 6 -8q-5 -5 -3 -12q3 -7 8 -7t8 7q2 7 -3 12q6 2 6 8z" fill="#9a9ea6" stroke="#55585f" stroke-width="1.4"/><circle cx="${rx}" cy="${ry - 14}" r="7" fill="#a9adb4" stroke="#55585f" stroke-width="1.4"/><ellipse cx="${rx - 2.5}" cy="${ry - 16.5}" rx="2.4" ry="1.6" fill="#fff" opacity=".55"/></g>`);
      out.push(`<title>Bandido: esta casilla no produce</title>`);
    }
    // roads
    Object.entries(s.roads).forEach(([e, o]) => {
      const ed = G.edges[e], va = G.vertices[ed.a], vb = G.vertices[ed.b];
      const x1 = va.x * S, y1 = va.y * S, x2 = vb.x * S, y2 = vb.y * S;
      const sx = x1 + (x2 - x1) * 0.15, sy = y1 + (y2 - y1) * 0.15, ex = x1 + (x2 - x1) * 0.85, ey = y1 + (y2 - y1) * 0.85;
      const c = colorOf(o);
      out.push(`<line x1="${sx}" y1="${sy + 2}" x2="${ex}" y2="${ey + 2}" stroke="rgba(0,0,0,.4)" stroke-width="16" stroke-linecap="round"/>`);
      out.push(`<line x1="${sx}" y1="${sy}" x2="${ex}" y2="${ey}" stroke="#0b1418" stroke-width="16" stroke-linecap="round"/>`);
      out.push(`<line x1="${sx}" y1="${sy}" x2="${ex}" y2="${ey}" stroke="${shade(c, -0.25)}" stroke-width="12" stroke-linecap="round"/>`);
      out.push(`<line x1="${sx}" y1="${sy - 2}" x2="${ex}" y2="${ey - 2}" stroke="${c}" stroke-width="6" stroke-linecap="round"/>`);
    });
    // buildings
    Object.entries(s.buildings).forEach(([v, bd]) => {
      const x = G.vertices[v].x * S, y = G.vertices[v].y * S;
      // Pieces are drawn bigger than the toolbar icons so they read well on the map.
      out.push(`<g transform="translate(${x} ${y}) scale(1.6)">${bd.t === 's' ? settlementShape(0, 0, colorOf(bd.o)) : cityShape(0, 0, colorOf(bd.o))}</g>`);
    });
    // targets
    t.hexes.forEach((hi) => out.push(`<polygon class="hex-target" data-act="hex" data-h="${hi}" points="${hexPts(hi, 0.95)}"><title>Mover el bandido aquí</title></polygon>`));
    t.edges.forEach((e) => {
      const ed = G.edges[e], va = G.vertices[ed.a], vb = G.vertices[ed.b];
      const x1 = va.x * S, y1 = va.y * S, x2 = vb.x * S, y2 = vb.y * S;
      out.push(`<line class="edge-hit" data-act="edge" data-e="${e}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"><title>Construir camino aquí</title></line>`);
      out.push(`<line class="edge-glow" x1="${x1 + (x2 - x1) * 0.2}" y1="${y1 + (y2 - y1) * 0.2}" x2="${x1 + (x2 - x1) * 0.8}" y2="${y1 + (y2 - y1) * 0.8}"/>`);
    });
    t.verts.forEach((v) => out.push(`<g class="spot" data-act="vert" data-v="${v}"><circle class="ring" cx="${G.vertices[v].x * S}" cy="${G.vertices[v].y * S}" r="11"/><circle cx="${G.vertices[v].x * S}" cy="${G.vertices[v].y * S}" r="18" fill="transparent"/><title>Construir poblado aquí</title></g>`));
    t.cities.forEach((v) => out.push(`<circle class="city-target" data-act="cityv" data-v="${v}" cx="${G.vertices[v].x * S}" cy="${G.vertices[v].y * S}" r="24"><title>Mejorar a ciudad</title></circle>`));
    return out.join('');
  }

  const VIEWBOX = '-300 -282 600 564';

  return { S, defs, staticLayer, liveLayer, resIcon, RES_COLOR, shade, VIEWBOX, settlementShape, cityShape };
})();
</script>
<script>
// Hexalia UI: accounts, online tables through the Vercel API (/api/game, /api/auth), the map and the side panel.
(() => {
  const E = Engine, RES = E.RES, B = Board;
  const $app = document.getElementById('app');

  const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const store = {
    get(k, d) { try { const v = localStorage.getItem('hexalia:' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { if (v === null) localStorage.removeItem('hexalia:' + k); else localStorage.setItem('hexalia:' + k, JSON.stringify(v)); } catch { /* storage unavailable */ } },
  };

  // ---------- Session state ----------
  let auth = store.get('auth', null); // { token, user }
  let myId = auth ? auth.user.id : null;
  let online = false, netChecked = false;
  let session = null; // { code, state }
  let unsubGame = null;
  let openGames = [], myGames = [];
  let busy = false;
  let skew = 0; // server clock minus this device's clock
  const shuffleIcon = '<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h3.5c2 0 3.2.9 4.3 2.6l2.4 4.8c1.1 1.7 2.3 2.6 4.3 2.6H21M3 17h3.5c1.5 0 2.5-.5 3.4-1.5M14.1 8.5c.9-1 1.9-1.5 3.4-1.5H21M18 4l3 3-3 3M18 14l3 3-3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  let demo = E.newGame('demo', 'Demo');
  const shuffleMap = () => { demo = { ...demo, board: E.generateBoard() }; render(); };
  const ui = {
    mode: null, // 'road' | 'settle' | 'city'
    authTab: 'login', authName: '', authPass: '', authPass2: '',
    joinCode: '',
    discard: {}, tGive: {}, tGet: {},
    tradeTab: 'players', bankGive: null, bankGet: null,
    modal: null, modalData: null, confirmResign: false,
    pick: null, plenty: [], logOpen: false,
    toast: '', toastT: 0, lastDiceKey: '', closedOver: '',
  };
  let shown = { screen: null, boardKey: null };
  const map = { full: false, min: false, z: 1, cx: 0, cy: 0 };
  const VB = { x: -300, y: -282, w: 600, h: 564 };
  const isPhone = () => window.matchMedia('(max-width: 900px)').matches;
  const canPanZoom = () => map.full || !isPhone() || map.z > 1;

  function clampView() {
    map.z = Math.min(4, Math.max(1, map.z));
    const w = VB.w / map.z, h = VB.h / map.z;
    const mx = (VB.w - w) / 2, my = (VB.h - h) / 2;
    map.cx = Math.min(mx, Math.max(-mx, map.cx));
    map.cy = Math.min(my, Math.max(-my, map.cy));
  }
  function applyView() {
    const svg = document.getElementById('board');
    const bw = document.getElementById('bw');
    if (!svg || !bw) return;
    clampView();
    const w = VB.w / map.z, h = VB.h / map.z;
    svg.setAttribute('viewBox', `${(VB.x + VB.w / 2 + map.cx - w / 2).toFixed(1)} ${(VB.y + VB.h / 2 + map.cy - h / 2).toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)}`);
    bw.classList.toggle('full', map.full);
    bw.classList.toggle('min', map.min && !map.full);
    bw.classList.toggle('pz', canPanZoom());
    document.body.classList.toggle('map-open', map.full);
  }
  function setZoom(z) { map.z = z; applyView(); }
  function openFull() { map.full = true; map.min = false; render(); }
  function closeFull() { map.full = false; map.z = 1; map.cx = 0; map.cy = 0; render(); }

  function attachPanZoom(bw) {
    const pts = new Map();
    let start = null, pinch = null, moved = false;
    const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
    const unitsPerPx = () => {
      const r = document.getElementById('board').getBoundingClientRect();
      return Math.max(VB.w / map.z / r.width, VB.h / map.z / r.height);
    };
    bw.addEventListener('pointerdown', (e) => {
      if (e.target.closest('button')) return;
      pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pts.size === 1) { moved = false; start = { x: e.clientX, y: e.clientY, cx: map.cx, cy: map.cy }; }
      if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = { d: dist(a, b) || 1, z: map.z }; }
    });
    bw.addEventListener('pointermove', (e) => {
      if (!pts.has(e.pointerId)) return;
      pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (!start) return;
